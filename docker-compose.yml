# Same file runs locally and on the EC2 box (Section 10 is a deploy-target change,
# not a redesign). M1 scope: postgres, redis, feed-service.
# M2 adds: prometheus (scrapes feed-service:8000/metrics every 5s) and grafana
# (datasource + one 3-panel dashboard, both provisioned from ./grafana).

services:
  postgres:
    image: postgres:16
    container_name: pulsecheck-postgres   # pinned so the M4 watchdog's Docker-SDK lookup is stable
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data   # named volume -> tick history survives `docker compose down`
    networks:
      - pulsecheck-net
    # No `ports:` — 5432 is NEVER published to the host. feed-service reaches it
    # by service name over the bridge network. Matches the AWS security-group rule.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: pulsecheck-redis
    networks:
      - pulsecheck-net
    # No `ports:` — 6379 is never published either.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  feed-service:
    build: ./feed-service
    container_name: pulsecheck-feed-service
    env_file: .env            # single source of config; POSTGRES_HOST=postgres, REDIS_HOST=redis
    ports:
      - "8000:8000"           # published: Prometheus (M2) and the host watchdog (M4) poll this
    volumes:
      - ./logs:/app/logs      # bind mount so the host log-watcher (M3) can tail the JSON log
    networks:
      - pulsecheck-net
    depends_on:
      postgres:
        condition: service_healthy   # start ordering only; app-side backoff still covers mid-run failures
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pulsecheck-prometheus   # pinned for the M4 watchdog's Docker-SDK lookup
    volumes:
      # Config only, read-only. The TSDB lives in the anonymous volume Prometheus
      # declares at /prometheus; demo data is disposable so it is not named.
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Keep the local demo footprint small; 24h of 5s scrapes is plenty.
      - --storage.tsdb.retention.time=24h
    ports:
      - "9090:9090"   # published so the checkpoint can eyeball Status > Targets = UP
    networks:
      - pulsecheck-net
    depends_on:
      - feed-service   # not a hard requirement (Prometheus retries), just start ordering

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pulsecheck-grafana
    environment:
      # Local demo credentials only. On EC2 the security group limits 3000 to a
      # single source IP (Section 10b); this is not a public instance.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Anonymous read-only view so the demo dashboard opens with no login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      # Provisioning (datasource + dashboard provider) and the dashboard JSON are
      # read-only from the repo. Grafana's own state (sessions, prefs) goes in the
      # named volume so it survives `docker compose down` without hiding drift in
      # the provisioned config.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - pulsecheck-net
    depends_on:
      - prometheus

networks:
  pulsecheck-net:
    driver: bridge

volumes:
  pgdata:
  grafana-data:
