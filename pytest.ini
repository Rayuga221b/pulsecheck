# pytest configuration. Kept in an ini file (not pyproject.toml) to stay
# consistent with the "no monorepo tooling, per-folder requirements" decision in
# CLAUDE.md — this is test-runner config, nothing more.
[pytest]
# The three component test suites. Each is a plain folder of test_*.py files;
# import paths are set up in the repo-root conftest.py.
testpaths =
    feed-service/tests
    watchdog/tests
    log_watcher/tests
# -ra: show a short reason line for every non-passing test at the end.
# --strict-markers: an unknown @pytest.mark typo fails instead of silently no-op.
addopts = -ra --strict-markers
